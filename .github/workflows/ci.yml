name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci && git config --global protocol.file.allow always
      - run: npm test

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse every JSON manifest
        run: for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json package.json; do node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" || exit 1; done
      - name: Install Claude Code for plugin validation
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin and marketplace
        run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
